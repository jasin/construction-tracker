<!DOCTYPE html>
<html>
<head>
    <title>CORS Test</title>
</head>
<body>
    <h1>CORS Test</h1>
    <button onclick="testCORS()">Test CORS Request</button>
    <pre id="output"></pre>

    <script>
        async function testCORS() {
            const output = document.getElementById('output');
            output.textContent = 'Testing CORS...';

            try {
                const response = await fetch('http://localhost:8000/api/auth/me', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });

                output.textContent = `Success!\nStatus: ${response.status}\nHeaders:\n`;
                response.headers.forEach((value, key) => {
                    output.textContent += `${key}: ${value}\n`;
                });

                const data = await response.json();
                output.textContent += `\nResponse: ${JSON.stringify(data, null, 2)}`;
            } catch (error) {
                output.textContent = `Error: ${error.message}\n${error.stack}`;
            }
        }
    </script>
</body>
</html>
